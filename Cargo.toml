[package]
name = "edclipmanager"
version = "1.0.0"
edition = "2021"
description = "A TUI clipboard manager for Wayland using cliphist"
authors = ["ed"]

[[bin]]
name = "edclipmanager"
path = "src/main.rs"

[dependencies]
ratatui = "0.29"
crossterm = "0.28"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
dirs = "5"
chrono = { version = "0.4", features = ["serde"] }

[profile.release]
opt-level = "z"
lto = true
strip = true
